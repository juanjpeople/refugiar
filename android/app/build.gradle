apply plugin: 'com.android.application'

// La app de Android es la web: abre https://refugi.ar en Chrome, a pantalla completa (Trusted Web
// Activity). Cuentas, nube, invitaciones y llaves de acceso funcionan igual que en el navegador, y
// cada deploy de la web la actualiza. Cambiar el origen exige publicar assetlinks.json en el nuevo.
def appHost = 'refugi.ar'
def appOrigin = "https://${appHost}"
// La mitad de la app en la verificación con public/.well-known/assetlinks.json (comillas escapadas
// para el XML de recursos, como lo arma Bubblewrap).
def assetStatements = '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"' + appOrigin + '\\"}}]'

def buildVersionCode = providers.gradleProperty('appVersionCode').getOrElse('1').toInteger()
if (buildVersionCode < 1 || buildVersionCode > 2100000000) {
    throw new GradleException('appVersionCode must be between 1 and 2100000000')
}

// Firma de producción: android/keystore.properties (local, ignorado por git) o variables de entorno (CI).
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingValue = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')

// Nombre visible: el mismo de la web (NEXT_PUBLIC_APP_NAME). El applicationId es fijo (ver docs/ANDROID.md).
def brandName = (System.getenv('NEXT_PUBLIC_APP_NAME') ?: '').trim() ?: 'Refugiar'
// La versión visible sale de package.json, la misma que muestra la web.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = "ar.refugi.app"
    compileSdk = 36
    buildFeatures {
        resValues = true
    }
    defaultConfig {
        applicationId "ar.refugi.app"
        minSdk 24
        targetSdk 36
        versionCode buildVersionCode
        versionName appVersion
        resValue "string", "app_name", brandName
        resValue "string", "asset_statements", assetStatements
        manifestPlaceholders = [appHost: appHost, launchUrl: "${appOrigin}/"]
    }
    // La app no lleva archivos web: los sirve refugi.ar. Así un build viejo de Capacitor que haya
    // quedado en assets/ no se empaqueta.
    sourceSets {
        main.assets.srcDirs = []
    }
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
