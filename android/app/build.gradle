apply plugin: 'com.android.application'

def appHost = 'refugi.ar'

def buildVersionCode = providers.gradleProperty('appVersionCode').getOrElse('1').toInteger()
if (buildVersionCode < 1 || buildVersionCode > 2100000000) {
    throw new GradleException('appVersionCode must be between 1 and 2100000000')
}

// Firma de producción: android/keystore.properties (local, ignorado por git) o variables de entorno (CI).
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def signingValue = { String key, String env -> signingProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')

// Nombre visible: el mismo de la web (NEXT_PUBLIC_APP_NAME). El applicationId es fijo (ver docs/ANDROID.md).
def brandName = (System.getenv('NEXT_PUBLIC_APP_NAME') ?: '').trim() ?: 'Refugiar'

android {
    namespace = "ar.refugi.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        resValues = true
        buildConfig = true
    }
    defaultConfig {
        applicationId "ar.refugi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode
        versionName new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
        resValue "string", "app_name", brandName
        resValue "string", "title_activity_main", brandName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "APP_ORIGIN", '"https://refugi.ar"'
        manifestPlaceholders = [appLinksHost: 'refugi.ar']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        lab {
            initWith debug
            applicationIdSuffix '.lab'
            matchingFallbacks = ['debug']
            resValue "string", "app_name", "Refugiar Lab"
            resValue "string", "title_activity_main", "Refugiar Lab"
            buildConfigField "String", "APP_ORIGIN", '"http://localhost:4195"'
            manifestPlaceholders = [appLinksHost: 'localhost']
        }
        release {
            if (releaseStoreFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testBuildType = providers.gradleProperty('testBuildType').getOrElse('debug')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.espresso:espresso-intents:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('verifyPackagedApp') {
    doLast {
        def metadata = file('src/main/assets/public/build-info.json')
        if (!metadata.exists() || !file('src/main/assets/public/index.html').exists()) {
            throw new GradleException('Faltan recursos locales. Ejecutar npm run android:sync.')
        }
        def info = new groovy.json.JsonSlurper().parse(metadata)
        if (info.native != true || info.localOnly != false || info.demo != false) {
            throw new GradleException('Android requiere un build autónomo con nube opcional, no una demo o build local-only.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPackagedApp' }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] } && !releaseStoreFile) {
        throw new GradleException('La entrega release requiere firma configurada. Ver docs/PLAY_STORE.md.')
    }
}
