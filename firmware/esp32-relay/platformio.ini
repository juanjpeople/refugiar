; Prototipo de base local ESP32 de Refugiar. Ver README.md.
[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; ESP32-S3 con el puerto USB-serie (UART) de la placa.
[env:esp32s3]
board = esp32-s3-devkitc-1

; ESP32-S3 conectado por su USB nativo (si con la anterior no aparece texto en el monitor).
[env:esp32s3-usb]
board = esp32-s3-devkitc-1
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 con PSRAM: "R8" en el chip (N8R8, N16R8) usa la primera; "R2" (N4R2, N8R2) la segunda.
; Sin estas, la placa informa "PSRAM: no tiene" aunque la tenga.
[env:esp32s3-r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM

[env:esp32s3-r2]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags = -DBOARD_HAS_PSRAM

; ESP32 clásico.
[env:esp32]
board = esp32dev
