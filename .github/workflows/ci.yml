# Cada PR y cada push a main: tipos, lint, tests, build estático y pruebas de punta a punta.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  api:
    name: API (Worker + D1 local)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # El Worker sirve la app desde out/: alcanza con una carpeta vacía para probar la API.
      - run: mkdir -p out
      - name: Secretos de prueba (solo para este job)
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32 | tr -d '=+/')"
            echo "APP_ORIGIN=http://localhost:8787"
            echo "DEV_ORIGINS=http://localhost:3000"
            # Como en producción: crear una casa pide licencia (el test la emite por la API de administración).
            echo "HOUSEHOLD_ACCESS=codes"
            echo "ADMIN_TOKEN=$(openssl rand -hex 32)"
            echo "OPERATOR_LOCAL_TEST=1"
            # Nunca contacta servicios externos: el backend en memoria solo se habilita en localhost.
            echo "PHOTO_STORAGE=memory"
          } > .dev.vars
      - run: npx wrangler d1 migrations apply opendomus --local
      - name: Recorrido de la API (cuentas, licencias, casas, invitaciones, permisos)
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          node --import ./scripts/test-hooks.mjs --test server/test/api.e2e.ts || (cat wrangler.log; exit 1)

  e2e:
    name: Build y pruebas de punta a punta
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # El sitio estático listo para publicar (Cloudflare Pages, la NAS…).
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: sitio
          path: out
          retention-days: 7
