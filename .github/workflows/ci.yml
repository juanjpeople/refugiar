# Cada PR: tipos, lint, tests, API y las pruebas de punta a punta esenciales, en escritorio.
# Al mergear a main corre todo: celular, temas, capturas y el paquete local para NAS.
# Android con emulador corre aparte (android.yml): en main, semanal y a pedido, no en los PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint y tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:operator

  api:
    name: API (Worker + D1 local)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # El Worker sirve la app desde out/: alcanza con una carpeta vacía para probar la API.
      - run: mkdir -p out
      - name: Secretos de prueba (solo para este job)
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32 | tr -d '=+/')"
            echo "APP_ORIGIN=http://127.0.0.1:8787"
            echo "DEV_ORIGINS=http://localhost:3000"
            # Como en producción: crear una casa pide licencia (el test la emite por la API de administración).
            echo "HOUSEHOLD_ACCESS=codes"
            echo "OPERATOR_EMAIL=operator@localhost.test"
            echo "OPERATOR_KEY_HASH=$(printf 'abababababababababababababababababababababababababababababababab' | openssl dgst -sha256 | awk '{print $NF}')"
            echo "OPERATOR_TOTP_SECRET=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ"
            # Nunca contacta servicios externos: el backend en memoria solo se habilita en localhost.
            echo "PHOTO_STORAGE=memory"
          } > .dev.vars
      - run: npx wrangler d1 migrations apply opendomus --local
      - name: Recorrido de la API (cuentas, licencias, casas, invitaciones, permisos)
        # Con routes (refugi.ar) wrangler dev reescribe el host de cada pedido al del dominio;
        # --local-upstream lo deja en 127.0.0.1:8787, que es el APP_ORIGIN de este job.
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 --local-upstream 127.0.0.1:8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          node --import ./scripts/test-hooks.mjs --test server/test/api.e2e.ts || (cat wrangler.log; exit 1)

  e2e:
    name: Build y pruebas de punta a punta
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      - run: npx playwright install --with-deps chromium
      - run: npm run build:operator
      - run: npx playwright test --config playwright.operator.config.ts
      # En los PR solo lo esencial en escritorio; en main, todo y también en celular.
      - run: npm run e2e
        env:
          E2E_FULL: ${{ github.event_name == 'push' && '1' || '' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Build cloud: necesita la API. El paquete para NAS se genera en local-package.
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: sitio
          path: out
          retention-days: 7

  local-package:
    name: Paquete local y navegador
    # Cambia poco: se arma y se prueba al mergear a main, sin gastar minutos en cada PR.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:local
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:local
      - uses: actions/upload-artifact@v7
        with:
          name: refugiar-local
          path: |
            dist/**/*.tgz
            dist/**/*.tgz.sha256
          retention-days: 7

  demo:
    name: Casa demo aislada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:demo
        env:
          E2E_FULL: ${{ github.event_name == 'push' && '1' || '' }}
      - run: npx wrangler deploy --config wrangler.demo.jsonc --dry-run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-test-results
          path: test-results
          retention-days: 7
