name: Android

# La app de Android abre refugi.ar en Chrome (Trusted Web Activity): no lleva pantallas propias,
# así que lo que se ve lo prueba Playwright en el CI de la web. Acá solo se compila y se revisa.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'public/.well-known/**'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/.well-known/**'
      - 'scripts/build-android.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y revisar
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-no-production
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
