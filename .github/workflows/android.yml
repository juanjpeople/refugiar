name: Android

# Android incluye el export web. Compilarlo antes de Gradle es obligatorio.
# Se verifica en cada PR antes del merge y se conserva el APK de main.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'scripts/build-android.mjs'
      - 'scripts/build.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'src/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run android:sync
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y revisar
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-debug-no-production
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
