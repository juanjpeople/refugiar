name: Android

# Android incluye el export web. Compilarlo antes de Gradle es obligatorio.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'public/**'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'scripts/build-android.mjs'
      - 'scripts/build.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'src/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'public/**'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'scripts/build-android.mjs'
      - 'scripts/build.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'src/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run android:sync
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y revisar
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-no-production
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
